name: antam
description: "Dự án An Tâm Nghe - Flutter Firebase"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- UI Icons ---
  cupertino_icons: ^1.0.6

  # --- Overlay & Phone ---
  flutter_overlay_window: ^0.5.0
  phone_state: ^3.0.1

  # --- Database Local ---
  sqflite: ^2.3.0
  path: ^1.9.0

  # --- FIREBASE (Bản mới đồng bộ - Sửa lỗi signInMethod) ---
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1

  shared_preferences: ^2.2.2

  # --- Tiện ích ---
  call_log: ^6.0.1
  flutter_contacts: ^1.1.9
  permission_handler: ^12.0.1
  intl: ^0.20.2
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true